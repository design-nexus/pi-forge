name: bootstrap-2761

# One-shot: applies the model-hub.ts patch for #2761 with byte-exact unicode
# preservation, verifies the resulting blob SHA (fail-closed), then removes
# this workflow and its script so the PR diff contains only the real change.

on:
  push:
    branches:
      - fix/2761-hide-idle-local-providers

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply anchored edits
        run: python3 .github/bootstrap-2761.py

      - name: Verify patched blob SHA (fail-closed)
        run: |
          actual=$(git hash-object packages/coding-agent/src/modes/components/model-hub.ts)
          expected=2218f99e1c7ae5155c08f7ee7656a22a9417fc16
          echo "actual:   $actual"
          echo "expected: $expected"
          if [ "$actual" != "$expected" ]; then
            echo 'FATAL: patched model-hub.ts does not match the reviewed target blob'
            exit 1
          fi

      - name: Commit patch and remove bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/bootstrap-2761.py .github/workflows/bootstrap-2761.yml
          git add packages/coding-agent/src/modes/components/model-hub.ts
          git commit -m 'fix(model-hub): hide unconfigured local providers with dead endpoints (#2761) [bootstrap-applied]'
          git push
