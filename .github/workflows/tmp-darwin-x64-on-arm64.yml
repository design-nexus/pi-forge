name: TMP darwin-x64 on arm64 probe

# Throwaway feasibility probe for building/smoking the darwin-x64 release leg
# on the macos-14 (arm64) runner instead of macos-15-intel. Build-only: never
# signs, uploads, or publishes. Delete before merging.

on:
   push:
      branches: [ci/uplift-wins]
      paths:
         - ".github/workflows/tmp-darwin-x64-on-arm64.yml"

permissions:
   contents: read

jobs:
   binary_rosetta:
      name: "Probe: darwin-x64 binary + Rosetta smoke on macos-14"
      runs-on: macos-14
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Rosetta status
           run: |
              uname -m
              if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
                echo "rosetta: already installed"
              else
                echo "rosetta: missing; installing"
                sudo softwareupdate --install-rosetta --agree-to-license
                /usr/bin/arch -x86_64 /usr/bin/true
              fi
         - run: bun install --frozen-lockfile
         - name: Fetch latest darwin-x64 release addon (npm)
           run: |
              set -euo pipefail
              tarball="$(npm view @oh-my-pi/pi-natives-darwin-x64@latest dist.tarball)"
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
              cp "$RUNNER_TEMP"/package/*.node packages/natives/native/
              ls -la packages/natives/native/*.node
         - name: Build darwin-x64 release binary on arm64
           env:
              RELEASE_TARGETS: darwin-x64
           run: bun run ci:release:build-binaries
         - name: Smoke darwin-x64 binary under Rosetta
           run: |
              file packages/coding-agent/binaries/omp-darwin-x64
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" packages/coding-agent/binaries/omp-darwin-x64 --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" packages/coding-agent/binaries/omp-darwin-x64 --smoke-test

   addon_cross:
      name: "Probe: bazel darwin-x64-baseline addon on macos-14"
      runs-on: macos-14
      timeout-minutes: 75
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         # Restores main's darwin-arm64 archive (non-main refs never save):
         # exec-config tools and the repo cache transfer; only x86_64
         # target-config actions should run.
         - uses: ./.github/actions/bazel-natives
           with:
              targets: darwin-x64-baseline
              cache-scope: release-darwin-arm64
              dest: ${{ runner.temp }}/addon
         - name: Inspect addon
           run: file "$RUNNER_TEMP"/addon/*.node
