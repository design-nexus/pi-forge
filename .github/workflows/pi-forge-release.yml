name: Pi Forge draft release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pi-forge-release
  cancel-in-progress: false
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: bun install --frozen-lockfile
      - run: bun run build:native
      - name: Build Linux x64 baseline binary
        run: CROSS_TARGET=linux-x64 bun packages/coding-agent/scripts/build-binary.ts
      - name: Verify compiled workers and identity
        run: |
          version=$(bun -e 'import app from "./packages/utils/src/app-identity.json"; console.log(app.version)')
          test "$(packages/coding-agent/dist/pi-forge-linux-x64 --version)" = "pi-forge/$version"
          packages/coding-agent/dist/pi-forge-linux-x64 --smoke-test
          packages/coding-agent/dist/pi-forge-linux-x64 --help
      - name: Prepare checksum and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bun -e 'import app from "./packages/utils/src/app-identity.json"; console.log(app.version)')
          cd packages/coding-agent/dist
          sha256sum pi-forge-linux-x64 > SHA256SUMS
          gh release create "v$version" pi-forge-linux-x64 SHA256SUMS --repo design-nexus/pi-forge --target "$GITHUB_SHA" --draft --title "Pi Forge $version" --notes "Linux x64 glibc release. Install as pi-forge; application state is separate from OMP."
